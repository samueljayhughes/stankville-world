name: stankville

# Base44 sandbox environment.
#
# This is a Reddit Devvit app: production runs on Reddit via `devvit playtest` /
# `devvit upload`. That path needs a Reddit login and Reddit's plugin host, so
# the sandbox instead runs the repo's real client entrypoints and real Hono API
# through the preview harness in `dev/` (see AGENTS.md).
services:
  app:
    image: node:22
    working_dir: /app
    # Install from the lockfile only when the mounted node_modules is missing or
    # stale, then exec the dev server in the foreground.
    command:
      - sh
      - -ec
      - |
        if [ ! -f node_modules/.package-lock.json ] || ! cmp -s node_modules/.package-lock.json package-lock.json; then
          npm ci --no-audit --no-fund
        fi
        exec npx vite --config dev/vite.config.mjs
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '3000:3000'
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    labels:
      base44.project: Stankville
      base44.kind: web
      base44.port: 3000
    healthcheck:
      # Checks both halves of the single dev server: the client entrypoint and
      # the real API route used by the game's first request.
      test:
        - CMD-SHELL
        - >-
          node -e "Promise.all(['http://127.0.0.1:3000/src/client/game.html','http://127.0.0.1:3000/api/init'].map((u)=>fetch(u))).then(([page,api])=>{if(!page.ok)console.error('client entrypoint failed: '+page.status);if(!api.ok)console.error('api /init failed: '+api.status);process.exit(page.ok&&api.ok?0:1);}).catch(()=>process.exit(1));"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: on-failure

volumes:
  node_modules:
